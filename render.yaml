# One-click deploy on Render: https://render.com/deploy?repo=<your repo URL>
services:
  - type: web
    name: doodle-royale
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
